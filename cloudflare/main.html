{{/* Publish the Cloudflare Worker once. */}}
{{ partialCached "./worker.html" . }}

	{{- $opts := dict
		"minify" true
	}}
	{{- with . | js.Build $opts | fingerprint }}

	{{- end }}
{{- end }}
